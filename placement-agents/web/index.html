<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<title>Hukum</title>
<style>
  :root { --bg:#0f1720; --card:#18232f; --fg:#e8eef4; --muted:#8aa0b4; --accent:#2f81f7; --live:#2ea043; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  body { display:flex; flex-direction:column; padding:16px; padding-bottom:max(16px, env(safe-area-inset-bottom)); }
  header { display:flex; align-items:center; justify-content:space-between; }
  h1 { font-size:18px; margin:0; font-weight:600; }
  .row { display:flex; gap:8px; }
  .pill { background:var(--card); color:var(--fg); border:1px solid #2a3a4b; border-radius:999px;
    padding:8px 14px; font-size:14px; cursor:pointer; }
  .pill.on { border-color:var(--accent); color:var(--accent); }
  #log { flex:1; overflow-y:auto; margin:14px 0; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:88%; padding:10px 14px; border-radius:16px; line-height:1.4; font-size:16px; white-space:pre-wrap; }
  .you { align-self:flex-end; background:#1f3a5f; border-bottom-right-radius:4px; }
  .bot { align-self:flex-start; background:var(--card); border-bottom-left-radius:4px; }
  #status { text-align:center; color:var(--muted); min-height:22px; font-size:14px; }
  #mic { align-self:center; width:96px; height:96px; border-radius:50%; border:none; margin:10px 0;
    background:var(--accent); color:#fff; font-size:38px; cursor:pointer; box-shadow:0 0 0 0 rgba(47,129,247,.5); }
  #mic.live { background:var(--live); animation:pulse 1.6s infinite; }
  @keyframes pulse { 70% { box-shadow:0 0 0 22px rgba(46,160,67,0); } 100% { box-shadow:0 0 0 0 rgba(46,160,67,0); } }
  #typed { display:flex; gap:8px; }
  #typed input { flex:1; background:var(--card); color:var(--fg); border:1px solid #2a3a4b; border-radius:12px;
    padding:12px; font-size:16px; }
  #typed button { background:var(--card); color:var(--fg); border:1px solid #2a3a4b; border-radius:12px; padding:0 16px; }
</style>
</head>
<body>
<header>
  <h1>🎙 Hukum</h1>
  <div class="row">
    <button class="pill" id="lang">हिं</button>
    <button class="pill" id="end">End</button>
  </div>
</header>
<div id="log"></div>
<div id="status">Tap the mic to start talking</div>
<button id="mic" aria-label="Start talking">🎙</button>
<form id="typed"><input id="txt" placeholder="…or type here" autocomplete="off"><button>Send</button></form>

<script>
const $ = s => document.querySelector(s);
const log = $('#log'), statusEl = $('#status'), mic = $('#mic');
const store = { get:k => { try { return localStorage.getItem(k); } catch(e) { return null; } },
                set:(k,v) => { try { localStorage.setItem(k,v); } catch(e) {} } };

// key comes from the link (?k=...), is remembered, then removed from the address bar
const url = new URL(location.href);
if (url.searchParams.get('k')) { store.set('k', url.searchParams.get('k')); }
const autoTalk = url.searchParams.get('talk') === '1';
if (url.search) history.replaceState(null, '', '/');
const KEY = store.get('k') || '';

let lang = store.get('lang') || 'hi-IN';
const setLangLabel = () => { $('#lang').textContent = lang === 'hi-IN' ? 'हिं' : 'EN'; $('#lang').classList.toggle('on', lang === 'en-IN'); };
setLangLabel();
$('#lang').onclick = () => { lang = lang === 'hi-IN' ? 'en-IN' : 'hi-IN'; store.set('lang', lang); setLangLabel(); };

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let active = false, rec = null, wake = null, busy = false;

function add(who, text) {
  const d = document.createElement('div'); d.className = 'msg ' + who; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}
function status(t) { statusEl.textContent = t; }

async function api(text) {
  const r = await fetch('/api/chat', { method:'POST',
    headers:{ 'Content-Type':'application/json', 'X-Key': KEY }, body: JSON.stringify({ text }) });
  if (r.status === 401) throw new Error('Wrong or missing key - open the link from the alert again');
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || 'server error');
  return j;
}

function pickVoice(l) {
  const vs = speechSynthesis.getVoices();
  return vs.find(v => v.lang.replace('_','-') === l) || vs.find(v => v.lang.startsWith(l.slice(0,2)));
}
function say(text) {
  return new Promise(res => {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = /[ऀ-ॿ]/.test(text) ? 'hi-IN' : 'en-IN';
    const v = pickVoice(u.lang); if (v) u.voice = v;
    u.rate = 1.0; u.onend = res; u.onerror = res;
    speechSynthesis.speak(u);
  });
}

async function turn(text) {
  if (busy) return; busy = true;
  add('you', text); status('thinking…'); mic.classList.remove('live');
  try {
    const j = await api(text);
    add('bot', j.text); status('speaking…');
    await say(j.speech || j.text);
  } catch (e) { add('bot', '⚠️ ' + e.message); active = false; }
  busy = false;
  if (active) listen(); else idle();
}

function idle() { mic.classList.remove('live'); status(active ? '' : 'Tap the mic to talk'); }

function listen() {
  if (!SR) { status('Voice input is not supported in this browser. Open in Chrome, or type below.'); active = false; return; }
  rec = new SR(); rec.lang = lang; rec.interimResults = true; rec.continuous = false;
  let finalText = '';
  rec.onstart = () => { mic.classList.add('live'); status('listening…'); };
  rec.onresult = e => {
    let t = ''; for (const r of e.results) t += r[0].transcript;
    status('🎙 ' + t); if (e.results[e.results.length - 1].isFinal) finalText = t;
  };
  rec.onerror = e => { if (e.error === 'not-allowed') { status('Microphone permission denied'); active = false; } };
  rec.onend = () => { mic.classList.remove('live');
    if (finalText.trim()) turn(finalText.trim()); else if (active) setTimeout(listen, 300); else idle(); };
  try { rec.start(); } catch (e) {}
}

async function start() {
  active = true; mic.setAttribute('aria-label', 'Stop');
  try { wake = await navigator.wakeLock.request('screen'); } catch (e) {}
  listen();
}
function stop() {
  active = false; try { rec && rec.abort(); } catch (e) {} speechSynthesis.cancel();
  try { wake && wake.release(); } catch (e) {} idle();
}
mic.onclick = () => active ? stop() : start();
$('#end').onclick = stop;
$('#typed').onsubmit = e => { e.preventDefault(); const t = $('#txt').value.trim(); if (t) { $('#txt').value = ''; turn(t); } };

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
speechSynthesis.onvoiceschanged = () => {};

// opened from the "Talk now" alert: Hukum speaks first (browsers need one tap before audio)
if (autoTalk && KEY) {
  status('Tap the mic - Hukum will greet you');
  mic.onclick = async () => { mic.onclick = () => active ? stop() : start(); active = true; await turn('__open__'); };
}
</script>
</body>
</html>
